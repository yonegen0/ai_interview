name: P4 manual dev plan or saved-plan apply
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan, apply]
        required: true
      plan_run_id:
        type: string
        description: Successful plan workflow run ID (apply only)
      plan_hash:
        type: string
        description: Reviewed SHA-256 of the saved plan (apply only)
permissions:
  contents: read
concurrency:
  group: p4-dev-deployment
  cancel-in-progress: false
jobs:
  backend:
    uses: ./.github/workflows/backend.yml
  offline:
    uses: ./.github/workflows/p4-static.yml
  deployment:
    needs: [backend, offline]
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - name: Require explicit main deployment
        env:
          P4_REF: ${{ github.ref }}
          P4_READY: ${{ vars.P4_AWS_EXECUTION_READY }}
        run: test "$P4_REF" = refs/heads/main && test "$P4_READY" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.8'
          python-version: '3.14'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - run: uv sync --locked
        working-directory: backend
      - name: Guarded operation (no raw Terraform output or tokens)
        working-directory: backend
        env:
          AWS_DEV_ACCOUNT_ID: ${{ vars.AWS_DEV_ACCOUNT_ID }}
          AWS_REGION: ap-northeast-1
          AWS_EC2_METADATA_DISABLED: 'true'
          P4_OIDC_SUBJECT: ${{ vars.P4_OIDC_SUBJECT }}
          P4_AWS_EXECUTION_READY: ${{ vars.P4_AWS_EXECUTION_READY }}
          P4_DEPLOY_INPUTS: ${{ vars.P4_DEPLOY_INPUTS }}
          P4_OPERATION: ${{ inputs.operation }}
          P4_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          P4_PLAN_HASH: ${{ inputs.plan_hash }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python skills/p4/ci_deploy.py
