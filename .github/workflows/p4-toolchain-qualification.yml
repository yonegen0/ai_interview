name: P4 candidate toolchain qualification
on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'backend/skills/p4/**'
      - 'backend/tests/unit/test_toolchain_*.py'
      - '.github/workflows/p4-toolchain-qualification.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'backend/skills/p4/**'
      - 'backend/tests/unit/test_toolchain_*.py'
      - '.github/workflows/p4-toolchain-qualification.yml'
permissions:
  contents: read
jobs:
  qualify:
    name: Offline Terraform ${{ matrix.terraform }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        terraform: ['1.16.7', '1.17.0']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Checkout immutable pre-upgrade configuration for migration comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 7ec3595aa02c5315f6d7600282b428d294d3d771
          path: migration-baseline
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Qualify disposable configurations without backend or AWS credentials
        env:
          CANDIDATE_TERRAFORM: ${{ matrix.terraform }}
        shell: bash
        run: |
          set -euo pipefail
          python3 backend/skills/p4/toolchain_migration.py \
            --repository migration-baseline \
            --candidate-repository . \
            --checkout-candidate 1.16.7 \
            --temp-parent "$RUNNER_TEMP" \
            --terraform "$(command -v terraform)" \
            --candidate "$CANDIDATE_TERRAFORM" \
            --compare-provider-schemas
