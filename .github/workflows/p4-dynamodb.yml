name: P4 manual real DynamoDB tests
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p4-dynamodb-tests
  cancel-in-progress: false
jobs:
  offline:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/backend.yml
  database:
    if: github.ref == 'refs/heads/main'
    needs: [offline]
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      deployments: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.8'
          python-version: '3.14'
      - run: uv sync --locked
        working-directory: backend
      - working-directory: backend
        env:
          AWS_DEV_ACCOUNT_ID: ${{ vars.AWS_DEV_ACCOUNT_ID }}
          AWS_REGION: ap-northeast-1
          AWS_EC2_METADATA_DISABLED: 'true'
          P4_OIDC_SUBJECT: ${{ vars.P4_OIDC_SUBJECT }}
          P4_AWS_EXECUTION_READY: ${{ vars.P4_AWS_EXECUTION_READY }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python skills/p4/ci_dynamodb.py
