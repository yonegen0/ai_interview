name: P4 OIDC claim discovery (no AWS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: '0.11.8'
          python-version: '3.14'
      - name: Allowlisted claims only; no AWS authentication
        env:
          P4_OIDC_DISCOVERY_READY: 'true'
          PYTHONPATH: backend/src
        run: uv run --no-project --python 3.14 python backend/skills/p4/oidc_discovery.py
