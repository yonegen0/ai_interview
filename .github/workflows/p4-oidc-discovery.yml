name: P4 OIDC claim discovery (no AWS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discovery:
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.5'
          python-version: '3.14.9'
      - name: Allowlisted claims only; no AWS authentication
        env:
          P4_OIDC_DISCOVERY_READY: 'true'
          PYTHONPATH: backend/src
        run: uv run --no-project --python 3.14.9 python backend/skills/p4/oidc_discovery.py
