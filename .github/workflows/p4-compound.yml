name: P4 manual dev compound plan
run-name: P4 ${{ inputs.operation }} approval-${{ inputs.plan_approval_sha256 }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [plan]
        required: true
      package_sha256:
        type: string
        description: Explicitly approved SHA-256 of the ZIP to rebuild (plan only)
      package_base_sha:
        type: string
        description: Available ancestor commit for offline package comparison (plan only)
      plan_approval_sha256:
        type: string
        description: Explicitly approved full package SHA-256 (plan only)
      compound_approval_sha256:
        type: string
        required: true
        description: Explicit compound approval full SHA-256
      evidence_cert_sha256:
        type: string
        description: Approved evidence recipient certificate DER SHA-256 (plan only)
      plan_approval_expires_at:
        type: string
        description: Exact package deadline in UTC with Z or +00:00 (plan only)
permissions:
  contents: read
concurrency:
  group: p4-dev-deployment
  cancel-in-progress: false
jobs:
  backend:
    if: inputs.operation == 'plan'
    uses: ./.github/workflows/backend.yml
  offline:
    if: inputs.operation == 'plan'
    uses: ./.github/workflows/p4-static.yml
    with:
      package_base_sha: ${{ inputs.package_base_sha }}
  deployment:
    if: inputs.operation == 'plan'
    needs: [backend, offline]
    environment: dev
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      P4_COMPOUND_APPROVAL_SHA256: ${{ inputs.compound_approval_sha256 }}
      P4_PLAN_APPROVAL_PACKAGE: ${{ secrets.P4_PLAN_APPROVAL_PACKAGE }}
      P4_PLAN_EVIDENCE_CERT_PEM: ${{ secrets.P4_PLAN_EVIDENCE_CERT_PEM }}
      P4_PLAN_EVIDENCE_CERT_SHA256: ${{ inputs.evidence_cert_sha256 }}
      P4_PLAN_APPROVAL_SHA256: ${{ inputs.plan_approval_sha256 }}
      P4_PLAN_APPROVAL_EXPIRES_AT: ${{ inputs.plan_approval_expires_at }}
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - name: Check absolute approval deadline at job start
        if: inputs.operation == 'plan'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, time
          from pathlib import Path
          from datetime import datetime, timezone
          status = "refused"
          try:
              raw = os.environ["P4_PLAN_APPROVAL_PACKAGE"]
              sha = os.environ["P4_COMPOUND_APPROVAL_SHA256"]
              if hashlib.sha256(raw.encode()).hexdigest() != sha:
                  raise ValueError()
              p = json.loads(raw)
              expiry = p["expires_at_utc"]
              if (p.get("execution_ready") is not True or p.get("apply") is not False or
                  p.get("mode") != "B" or p.get("policy_b_accepted") is not True or
                  expiry != os.environ["P4_PLAN_APPROVAL_EXPIRES_AT"] or
                  datetime.now(timezone.utc) >= datetime.fromisoformat(expiry.replace("Z", "+00:00"))):
                  raise ValueError()
              with open(os.environ["GITHUB_ENV"], "a") as stream:
                  stream.write(f"P4_PLAN_JOB_STARTED_MONOTONIC={time.monotonic()}\n")
              status = "passed"
          except Exception:
              raise SystemExit("PlanApprovalJobStartRefused") from None
          finally:
              path = Path(os.environ["RUNNER_TEMP"]) / "p4-plan-approval-job-start.private.json"
              with path.open("x") as stream:
                  os.chmod(path, 0o600)
                  json.dump({"status": status, "utc": datetime.now(timezone.utc).isoformat()}, stream)
          PY
      - name: Require explicit main deployment
        env:
          P4_REF: ${{ github.ref }}
          P4_READY: ${{ vars.P4_AWS_EXECUTION_READY }}
        run: test "$P4_REF" = refs/heads/main && test "$P4_READY" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.8'
          python-version: '3.14'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - run: uv sync --locked
        working-directory: backend
      - name: Guarded Plan (private values from environment Secrets)
        if: inputs.operation == 'plan'
        working-directory: backend
        env:
          AWS_DEV_ACCOUNT_ID: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
          AWS_REGION: ap-northeast-1
          AWS_EC2_METADATA_DISABLED: 'true'
          P4_OIDC_SUBJECT: ${{ secrets.P4_OIDC_SUBJECT }}
          P4_AWS_EXECUTION_READY: ${{ vars.P4_AWS_EXECUTION_READY }}
          P4_DEPLOY_INPUTS: ${{ secrets.P4_DEPLOY_INPUTS }}
          P4_OPERATION: ${{ inputs.operation }}
          P4_PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked python skills/p4/compound_ci.py
      - name: Encrypt detailed journal for the approved offline recipient
        if: always() && inputs.operation == 'plan'
        working-directory: backend
        run: uv run --locked python skills/p4/plan_evidence.py
      - name: Preserve fixed failure summary when checkout or setup was unavailable
        if: always() && inputs.operation == 'plan'
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          if not (root / "p4-public-evidence/summary.json").is_file():
              directory = root / "p4-public-fallback"
              directory.mkdir(mode=0o700, exist_ok=False)
              with (directory / "summary.json").open("x") as stream:
                  json.dump({"schema_version": 1, "evidence": "unavailable"}, stream)
          PY
      - name: Preserve public summary and encrypted evidence
        if: always() && inputs.operation == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plan-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/p4-public-evidence/summary.json
            ${{ runner.temp }}/p4-public-evidence/journal.cms
            ${{ runner.temp }}/p4-public-fallback/summary.json
          if-no-files-found: ignore
          retention-days: 30
