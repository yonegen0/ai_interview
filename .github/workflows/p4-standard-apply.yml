name: P4 standard apply only
run-name: P4 apply plan-${{ inputs.plan_run_id }}-${{ inputs.plan_hash }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Explicitly approved current main commit (40 hex)
        type: string
        required: true
      approved_at_utc:
        description: Approval issue UTC, YYYY-MM-DDTHH:MM:SSZ
        type: string
        required: true
      expires_at_utc:
        description: Same approval deadline, exactly 72 hours after issue
        type: string
        required: true
      plan_run_id:
        type: string
        required: true
      plan_hash:
        type: string
        required: true
      package_base_sha:
        description: Explicit ancestor commit used for package comparison (same verified baseline as the new Plan)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: p4-dev-deployment
  cancel-in-progress: false
jobs:
  backend:
    if: github.ref == 'refs/heads/main' && github.actor_id == '76547980' && github.triggering_actor == 'yonegen0' && github.run_attempt == 1 && inputs.source_sha == github.sha
    uses: ./.github/workflows/backend.yml
  offline:
    if: github.ref == 'refs/heads/main' && github.actor_id == '76547980' && github.triggering_actor == 'yonegen0' && github.run_attempt == 1 && inputs.source_sha == github.sha
    uses: ./.github/workflows/p4-static.yml
    with:
      package_base_sha: ${{ inputs.package_base_sha }}
  apply:
    needs: [backend, offline]
    environment: dev-apply
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    env:
      P4_STANDARD_ACTIVE: 'true'
      P4_OPERATION: apply
      P4_STANDARD_READY: ${{ vars.P4_STANDARD_READY }}
      P4_STANDARD_REVIEW_MODE: ${{ vars.P4_STANDARD_REVIEW_MODE }}
      P4_AWS_EXECUTION_READY: ${{ vars.P4_AWS_EXECUTION_READY }}
      P4_APPROVED_SOURCE_SHA: ${{ inputs.source_sha }}
      P4_APPROVED_AT_UTC: ${{ inputs.approved_at_utc }}
      P4_APPROVAL_EXPIRES_AT: ${{ inputs.expires_at_utc }}
      P4_OIDC_SUBJECT: repo:yonegen0@76547980/ai_interview@1361325921:environment:dev-apply
      AWS_DEV_ACCOUNT_ID: ${{ secrets.AWS_DEV_ACCOUNT_ID }}
      AWS_REGION: ap-northeast-1
      AWS_EC2_METADATA_DISABLED: 'true'
      P4_DEPLOY_INPUTS: ${{ secrets.P4_DEPLOY_INPUTS }}
      GH_TOKEN: ${{ github.token }}
      P4_PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      P4_PLAN_HASH: ${{ inputs.plan_hash }}
      P4_PACKAGE_BASE_SHA: ${{ inputs.package_base_sha }}
    steps:
      - name: Record job clock before setup
        run: |
          python3 - <<'PY'
          import os,time
          with open(os.environ['GITHUB_ENV'],'a') as stream:
              stream.write(f'P4_PLAN_JOB_STARTED_MONOTONIC={time.monotonic()}\n')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.5'
          python-version: '3.14.9'
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - name: Install existing locked dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Start conservative Environment token clock
        run: |
          python3 - <<'PY'
          import os, time
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write(f'P4_ENV_TOKEN_STARTED_AT={int(time.time())}\n')
          PY
      - name: Mint repository-only Environments read token
        id: environment-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.P4_ENV_APP_CLIENT_ID }}
          private-key: ${{ secrets.P4_ENV_APP_PRIVATE_KEY }}
          owner: yonegen0
          repositories: ai_interview
          permission-environments: read
      - name: Execute apply only
        working-directory: backend
        env:
          P4_ENV_READ_TOKEN: ${{ steps.environment-token.outputs.token }}
        run: |
          umask 077
          uv run --locked python skills/p4/ci_deploy.py
