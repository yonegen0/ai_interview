name: P4 offline infrastructure and package checks
on:
  workflow_call:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.9
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - name: Validate without backend or AWS credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 backend/skills/p4/offline_terraform.py --temp-parent "$RUNNER_TEMP"
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.8'
          python-version: '3.14'
      - name: Build from locked production requirements
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/p4-requirements.txt"
          uv pip install --python 3.14 --python-platform x86_64-manylinux_2_34 --target "$RUNNER_TEMP/p4-deps" --only-binary=:all: --require-hashes -r "$RUNNER_TEMP/p4-requirements.txt"
          uv run --no-project --python 3.14 python skills/p4/build_lambda.py --source src/interview_backend --dependencies "$RUNNER_TEMP/p4-deps" --lock uv.lock --output "$RUNNER_TEMP/p4.zip" --manifest "$RUNNER_TEMP/p4-package.json" --code-sha "$GITHUB_SHA"
          uv run --no-project --python 3.14 python -m zipfile -e "$RUNNER_TEMP/p4.zip" "$RUNNER_TEMP/p4-expanded"
      - name: Import expanded ZIP with no AWS access
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/p4-expanded"
          uv run --no-project --python 3.14 python - <<'PY'
          import pathlib
          import socket

          def forbidden(*args, **kwargs):
              raise RuntimeError("OfflineBoundaryViolation")

          socket.socket.connect = forbidden
          socket.socket.connect_ex = forbidden
          socket.create_connection = forbidden
          import interview_backend
          import interview_backend.aws_runtime as runtime
          import interview_backend.assets as assets

          for module in (interview_backend, runtime, assets):
              assert pathlib.Path(module.__file__).resolve().is_relative_to(pathlib.Path.cwd())
          assert all(callable(getattr(runtime, name)) for name in (
              "api_handler", "worker_handler", "dispatcher_handler"
          ))
          assert assets.load_questions()
          PY
