name: Dependency vulnerability audit
on:
  schedule:
    # Monday 06:23 JST; avoid the busy start of the UTC hour.
    - cron: '23 21 * * 0'
  pull_request:
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dependency-audit.yml'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
permissions:
  contents: read
jobs:
  npm:
    name: npm audit (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [all, production]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.4'
      - run: node --version && npm --version
      # Inspect the committed lockfile without installing packages or running scripts.
      - name: Audit all dependencies
        if: matrix.scope == 'all'
        run: npm audit --package-lock-only --include=dev --audit-level=low
      - name: Audit production dependencies
        if: matrix.scope == 'production'
        run: npm audit --package-lock-only --omit=dev --audit-level=low
  python:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          python-version: '3.14.9'
          enable-cache: false
      - name: Export all locked dependencies, including development tools
        run: uv export --locked --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/backend-audit.txt"
      - name: Audit exact versions without installing project dependencies
        run: uv tool run --python 3.14.9 --from pip-audit==2.10.1 pip-audit --strict --no-deps --disable-pip --require-hashes --progress-spinner off -r "$RUNNER_TEMP/backend-audit.txt"
