name: Backend
on:
  workflow_call:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    name: Backend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.14.9"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv --version
      - run: uv sync --locked
      - name: Verify locked project Python version
        run: |
          uv run --locked python --version
          uv run --locked python -c "import sys; assert sys.version_info[:3] == (3, 14, 9), 'BackendPythonVersionMismatch'"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check src tests skills
      - run: uv run --locked pytest -q -m "not dynamodb and not aws_e2e"
      - run: uv run --locked interview-demo
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0; user-confirmed official commit
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node --version
        working-directory: frontend
      - run: npm ci
        working-directory: frontend
      - run: npm run test:unit -- --run tests/backend-contract.test.ts
        working-directory: frontend
