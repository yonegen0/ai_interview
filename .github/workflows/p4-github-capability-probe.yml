name: P4 GitHub token capability audit (no AWS)
on:
  push:
    branches: [codex/gate-b-root-cause-20261027]
    paths: [.github/workflows/p4-github-capability-probe.yml]
permissions:
  contents: read
jobs:
  environment_api:
    name: Read-only job-token Environment API capability
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Observe HTTP status only (two GETs, no response bodies)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.error import HTTPError
          from urllib.request import Request, HTTPRedirectHandler, build_opener
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          for name in ('dev-plan', 'dev-apply'):
              request = Request(
                  'https://api.github.com/repos/yonegen0/ai_interview/environments/' + name + '/variables?per_page=100',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'},
              )
              status = 0
              try:
                  with build_opener(NoRedirect()).open(request, timeout=15) as response:
                      status = response.status
              except HTTPError as error:
                  status = error.code
                  error.close()
              except Exception:
                  pass
              print(json.dumps({'schema_version': 1, 'target': name, 'http_status': status,
                                'response_body_read': False, 'aws_requests': 0, 'retry': 0}))
              if status not in (200, 403, 404):
                  raise SystemExit('CapabilityAuditUnresolved')
          PY
