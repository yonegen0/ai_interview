name: Frontend
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    name: Frontend verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0; user-confirmed official commit
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook
      - run: npm run build:mock
      - run: npm run test:e2e
      - name: Bound failure report before upload
        if: failure()
        id: failure-report
        working-directory: .
        run: python3 frontend/scripts/bounded_report.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure() && steps.failure-report.outputs.ready == 'true'
        with:
          name: frontend-test-results
          path: ${{ runner.temp }}/frontend-test-results.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
