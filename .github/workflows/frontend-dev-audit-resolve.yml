name: Resolve frontend dev security dependencies
on:
  push:
    branches:
      - codex/security-frontend-dev-20261025
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Read baseline security audit
        run: |
          npm ci --ignore-scripts
          npm audit --json > "$RUNNER_TEMP/audit-before.json" || true
          AUDIT_FILE="$RUNNER_TEMP/audit-before.json" node - <<'JS'
          const fs=require("fs"); const a=JSON.parse(fs.readFileSync(process.env.AUDIT_FILE,"utf8"));
          console.log("DEV_AUDIT_BEFORE",JSON.stringify({summary:a.metadata?.vulnerabilities,findings:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.filter(x=>typeof x==="object").map(x=>({name:x.name,title:x.title,url:x.url,range:x.range}))}))}));
          JS
      - name: Resolve patched stable Storybook and dev dependencies
        run: |
          set -euo pipefail
          npm pkg set 'devDependencies.storybook=^10.6.3' 'devDependencies.@storybook/addon-a11y=^10.6.3' 'devDependencies.@storybook/addon-docs=^10.6.3' 'devDependencies.@storybook/addon-vitest=^10.6.3' 'devDependencies.@storybook/nextjs-vite=^10.6.3' 'devDependencies.eslint-plugin-storybook=^10.6.3'
          rm -rf node_modules
          npm install --package-lock-only --ignore-scripts
          npm update vite vitest @vitest/browser-playwright @vitest/coverage-v8 --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true
          npm ci --ignore-scripts
          node - <<'JS'
          const pkg=require("./package.json"),lock=require("./package-lock.json");
          for(const [k,v] of Object.entries(pkg.dependencies))if(lock.packages[""].dependencies[k]!==v)throw Error("RuntimeManifestMismatch:"+k);
          for(const [k,v] of Object.entries(pkg.devDependencies))if(lock.packages[""].devDependencies[k]!==v)throw Error("DevManifestMismatch:"+k);
          console.log("DEV_LOCK_VERIFIED",JSON.stringify({storybook:lock.packages["node_modules/storybook"]?.version,addonVitest:lock.packages["node_modules/@storybook/addon-vitest"]?.version,vitest:lock.packages["node_modules/vitest"]?.version,vite:lock.packages["node_modules/vite"]?.version}));
          JS
      - name: Inspect full and production audits after resolution
        run: |
          npm audit --json > "$RUNNER_TEMP/audit-after.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-production.json" || true
          node - <<'JS'
          const fs=require("fs");
          for(const [label,file] of [["DEV_AUDIT_AFTER","audit-after.json"],["PRODUCTION_AUDIT_AFTER","audit-production.json"]]){
            const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/"+file,"utf8"));
            console.log(label,JSON.stringify({summary:a.metadata?.vulnerabilities,findings:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable,via:v.via.filter(x=>typeof x==="object").map(x=>({name:x.name,title:x.title,url:x.url,range:x.range}))}))}));
          }
          JS
      - name: Print exact npm-generated manifest and lockfile
        run: |
          node - <<'JS'
          const fs=require("fs");
          for(const [label,file] of [["NPM_DEV_MANIFEST","package.json"],["NPM_DEV_LOCK","package-lock.json"]]){
            const data=fs.readFileSync(file).toString("base64");
            console.log(label+"_BASE64_BEGIN");
            for(let i=0;i<data.length;i+=160)console.log(data.slice(i,i+160));
            console.log(label+"_BASE64_END");
          }
          JS
